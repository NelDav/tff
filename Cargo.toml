[package]
name = "tff"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A node-based TUI for ffmpeg"
repository = "https://github.com/NelDav/tff"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tui-input = { version = "0.15.3", default-features = false, features = ["crossterm"] }
